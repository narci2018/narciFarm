[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "narcifarm"
version = "0.9.9"
description = "narciFarm 设备农场 Python SDK（设备枚举 / 场景运行 / 报告导出）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/narci2018/narciFarm"

[tool.setuptools.packages.find]
include = ["narcifarm*"]
