name: Build DPC

# 构建参考 DPC APK（设备托管的移动端组件）。
# 手动触发或 dpc/ 目录变更时自动跑；产物作为 Artifact 供下载。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dpc/**"]

jobs:
  build:
    name: 参考 DPC APK（Android）
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK（platform-34 / build-tools 34.0.0）
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q -O cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > dpc/narci_dpc/local.properties

      - name: 下载 Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: 构建 DPC（assembleDebug）
        working-directory: dpc/narci_dpc
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 列出产物
        run: ls -la dpc/narci_dpc/app/build/outputs/apk/debug/

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpc-apk
          path: dpc/narci_dpc/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
