name: Release

# 打 tag（v*）触发云端编译；也支持手动触发（仅产出 Artifact，不创建 Release）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  SCRCPY_VERSION: "5.0.1"

jobs:
  build-pc-exe:
    name: PC 端 exe（Windows x64）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 下载并暂存 adb（platform-tools）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_stage/adb | Out-Null
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath platform-tools -Force
          Copy-Item platform-tools/platform-tools/adb.exe, `
                     platform-tools/platform-tools/AdbWinApi.dll, `
                     platform-tools/platform-tools/AdbWinUsbApi.dll build_stage/adb/
          Get-ChildItem build_stage/adb

      - name: PyInstaller 打包
        run: pyinstaller narciFarm.spec --noconfirm

      - name: 冒烟测试 exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\narciFarm.exe" `
                 -ArgumentList "--port","8559","--no-browser" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8559/api/settings" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) { throw "exe 冒烟测试失败：/api/settings 不可达" }
          Stop-Process -Id $p.Id -Force
          Write-Host "exe 冒烟测试通过"

      - name: 重命名产物
        shell: pwsh
        run: Copy-Item dist/narciFarm.exe "narciFarm-windows-x64.exe"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: narciFarm-windows-x64
          path: narciFarm-windows-x64.exe

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: narciFarm-windows-x64.exe
          body: |
            ## narciFarm ${{ github.ref_name }}

            - **narciFarm-windows-x64.exe**：PC 端单文件程序（内置 adb 与 scrcpy-server）。无控制台窗口，启动后以系统托盘图标常驻（打开管理台 / 关闭服务），数据与日志在 exe 同级目录
            - **scrcpy-server-${{ env.SCRCPY_VERSION }}**：安卓端被控服务（本仓库 CI 从 [scrcpy v${{ env.SCRCPY_VERSION }}](https://github.com/Genymobile/scrcpy) 源码构建的 dex jar，与 exe 内置的官方预编译版同版本，可互换）

            使用：运行 exe 后浏览器自动打开管理台；手机开启 USB 调试即可被识别。关闭：托盘图标右键 → 关闭服务。
          fail_on_unmatched_files: true

  build-android-server:
    name: 安卓端 scrcpy-server（源码构建）
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 克隆 scrcpy 源码（锁定 tag）
        run: |
          git clone --depth 1 --branch "v${SCRCPY_VERSION}" \
            https://github.com/Genymobile/scrcpy scrcpy-src
          echo "已克隆 scrcpy v${SCRCPY_VERSION}"

      - name: 安装 Android SDK 组件（platform-36 / build-tools 36.0.0）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 无 Gradle 构建 scrcpy-server
        working-directory: scrcpy-src/server
        run: |
          BUILD_DIR=build_manual ./build_without_gradle.sh
          cp build_manual/scrcpy-server "$GITHUB_WORKSPACE/scrcpy-server-${SCRCPY_VERSION}"
          ls -la "$GITHUB_WORKSPACE/scrcpy-server-${SCRCPY_VERSION}"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server
          path: scrcpy-server-${{ env.SCRCPY_VERSION }}

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: scrcpy-server-${{ env.SCRCPY_VERSION }}
          fail_on_unmatched_files: true
